# P2.T6 — committed example config per plan.md §2
# Do NOT edit in place for local use — override via .env.local.

llm:
  base_url: "http://localhost:11434/v1"
  model_name: "llama3"
  api_key_env: "API_KEY"
  timeout: 30
  max_iterations: 8

# Optional manual tool endpoints (the free built-in fetcher + DuckDuckGo search
# work without any endpoint configuration — see docs/config-reference.md).
endpoints: []

custom_endpoints: []

# MCP servers are seeded automatically with the free built-ins
# (builtin-fetcher, builtin-search). Add stdio/SSE servers here only if needed.
mcp_servers: []
